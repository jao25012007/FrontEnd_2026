<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Bank - Lista VIP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .card {
      width: 450px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #2a5298;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: 0.3s;
    }

    .btn-add {
      background: #2a5298;
    }

    .btn-add:hover {
      background: #1e3c72;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .nome {
      flex: 1;
      font-size: 16px;
      color: #333;
    }

    .riscado {
      text-decoration: line-through;
      color: gray;
    }

    .acoes {
      display: flex;
      gap: 8px;
    }

    .concluir {
      background: #28a745;
    }

    .editar {
      background: #ffc107;
      color: black;
    }

    .excluir {
      background: #dc3545;
    }

    .concluir:hover {
      background: #1f8a39;
    }

    .editar:hover {
      background: #e0a800;
    }

    .excluir:hover {
      background: #bb2d3b;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Lista de Convidados VIP</h1>

    <div class="input-area">
      <input type="text" id="nomeConvidado" placeholder="Digite o nome">
      <button class="btn-add" id="adicionar">
        Adicionar
      </button>
    </div>

    <ul id="lista"></ul>

  </div>

  <script>
    const input = document.getElementById("nomeConvidado");
    const botaoAdicionar = document.getElementById("adicionar");
    const lista = document.getElementById("lista");

    let convidados = [];

    botaoAdicionar.addEventListener("click", adicionarConvidado);

    function adicionarConvidado() {

      const nome = input.value.trim();

      if (nome === "") {
        alert("Digite um nome válido!");
        return;
      }

      convidados.push(nome);

      renderizarLista();

      input.value = "";
      input.focus();
    }

    function renderizarLista() {

      lista.innerHTML = "";

      convidados.forEach((convidado, index) => {

        const li = document.createElement("li");

        li.innerHTML = `
          <span class="nome">${convidado}</span>

          <div class="acoes">
            <button class="concluir">
              Concluir
            </button>

            <button class="editar">
              Editar
            </button>

            <button class="excluir">
              Excluir
            </button>
          </div>
        `;

        // Botão concluir
        li.querySelector(".concluir")
          .addEventListener("click", () => {

            li.querySelector(".nome")
              .classList.toggle("riscado");
          });

        // Botão editar
        li.querySelector(".editar")
          .addEventListener("click", () => {

            let novoNome = prompt(
              "Editar nome:",
              convidados[index]
            );

            if (
              novoNome !== null &&
              novoNome.trim() !== ""
            ) {
              convidados[index] = novoNome.trim();

              renderizarLista();
            }
          });

        // Botão excluir
        li.querySelector(".excluir")
          .addEventListener("click", () => {

            convidados.splice(index, 1);

            renderizarLista();
          });

        lista.appendChild(li);
      });
    }
  </script>

</body>
</html>
