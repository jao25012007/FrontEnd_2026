<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9966, #ff5e62);
    }

    .container {
      background: white;
      padding: 35px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    .campo {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ff5e62;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Conversor de Temperatura</h1>

    <div class="campo">
      <label for="celsius">Celsius (°C)</label>
      <input type="number" id="celsius" step="0.1">
    </div>

    <div class="campo">
      <label for="fahrenheit">Fahrenheit (°F)</label>
      <input type="number" id="fahrenheit" step="0.1">
    </div>
  </div>

  <script>
    const celsius = document.getElementById("celsius");
    const fahrenheit = document.getElementById("fahrenheit");

    // Celsius -> Fahrenheit
    celsius.addEventListener("input", () => {

      if (celsius.value === "") {
        fahrenheit.value = "";
        return;
      }

      let c = parseFloat(celsius.value);

      let f = (c * 9/5) + 32;

      fahrenheit.value = f.toFixed(2);
    });

    // Fahrenheit -> Celsius
    fahrenheit.addEventListener("input", () => {

      if (fahrenheit.value === "") {
        celsius.value = "";
        return;
      }

      let f = parseFloat(fahrenheit.value);

      let c = (f - 32) * 5/9;

      celsius.value = c.toFixed(2);
    });
  </script>

</body>
</html>
