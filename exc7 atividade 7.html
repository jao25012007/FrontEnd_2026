<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Card Guard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .card {
      width: 450px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #243b55;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #243b55;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #141e30;
    }

    .painel {
      margin-top: 25px;
      background: #f4f4f4;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.8;
    }

    .valido {
      color: green;
      font-weight: bold;
    }

    .invalido {
      color: red;
      font-weight: bold;
    }

    .titulo {
      font-size: 18px;
      margin-bottom: 10px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Infinity Card Guard</h1>

    <input 
      type="text" 
      id="cartao"
      placeholder="Digite o número do cartão"
      maxlength="19"
    >

    <button id="analisar">
      Analisar Cartão
    </button>

    <div class="painel" id="resultado">

      <div class="titulo">
        Painel de Informações
      </div>

      Aguardando análise...
    </div>

  </div>

  <script>

    const botao = document.getElementById("analisar");

    botao.addEventListener("click", analisarCartao);

    function analisarCartao() {

      const input = document
        .getElementById("cartao");

      const resultado = document
        .getElementById("resultado");

      // Remove espaços e caracteres
      let numero = input.value
        .replace(/\D/g, "");

      // Verifica tamanho
      if (
        numero.length < 13 ||
        numero.length > 16
      ) {

        resultado.innerHTML = `
          <div class="titulo">
            Painel de Informações
          </div>

          <p class="invalido">
            Número inválido!
          </p>
        `;

        return;
      }

      // ===== Algoritmo de Luhn =====

      let soma = 0;

      let invertido = numero
        .split("")
        .reverse();

      for (let i = 0; i < invertido.length; i++) {

        let digito = Number(invertido[i]);

        // posições pares
        if (i % 2 !== 0) {

          digito *= 2;

          if (digito > 9) {
            digito -= 9;
          }
        }

        soma += digito;
      }

      const valido = soma % 10 === 0;

      // ===== Descobrir bandeira =====

      let bandeira = "Desconhecida";
      let banco = "Não identificado";

      if (/^4/.test(numero)) {
        bandeira = "Visa";
        banco = "Visa International";
      }

      else if (
        /^5[1-5]/.test(numero)
      ) {
        bandeira = "MasterCard";
        banco = "MasterCard Worldwide";
      }

      else if (
        /^3[47]/.test(numero)
      ) {
        bandeira = "American Express";
        banco = "AMEX";
      }

      else if (
        /^6(?:011|5)/.test(numero)
      ) {
        bandeira = "Discover";
        banco = "Discover Financial";
      }

      else if (
        /^4011|^4312|^4389/.test(numero)
      ) {
        bandeira = "Elo";
        banco = "Elo Brasil";
      }

      // ===== Categoria do setor =====

      let setor = "";

      switch (numero[0]) {

        case "1":
          setor = "Companhias Aéreas";
          break;

        case "2":
          setor = "Financeiro e Bancário";
          break;

        case "3":
          setor = "Turismo e Entretenimento";
          break;

        case "4":
        case "5":
          setor = "Instituições Financeiras";
          break;

        case "6":
          setor = "Comércio e Bancos";
          break;

        default:
          setor = "Não identificado";
      }

      // ===== Resultado =====

      resultado.innerHTML = `
        <div class="titulo">
          Painel de Informações
        </div>

        <p>
          <strong>Status:</strong>

          <span class="${
            valido ? "valido" : "invalido"
          }">

            ${
              valido
                ? "Cartão Válido"
                : "Cartão Inválido"
            }

          </span>
        </p>

        <p>
          <strong>Bandeira:</strong>
          ${bandeira}
        </p>

        <p>
          <strong>Categoria do Setor:</strong>
          ${setor}
        </p>

        <p>
          <strong>Banco Emissor:</strong>
          ${banco}
        </p>
      `;
    }

  </script>

</body>
</html>
