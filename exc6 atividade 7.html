<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crédito para Festas & Eventos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .card {
      width: 420px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    select:focus,
    input:focus {
      border-color: #243b55;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #243b55;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #141e30;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #f5f5f5;
      line-height: 1.8;
      color: #333;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      color: green;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Crédito para Eventos</h1>

    <div class="campo">
      <label for="pacote">Escolha o Pacote</label>

      <select id="pacote">
        <option value="50">Standard - R$ 50,00</option>
        <option value="80">Premium - R$ 80,00</option>
        <option value="120">Infinity Deluxe - R$ 120,00</option>
      </select>
    </div>

    <div class="campo">
      <label for="pessoas">Quantidade de Pessoas</label>

      <input 
        type="number" 
        id="pessoas" 
        placeholder="Digite a quantidade"
      >
    </div>

    <button id="calcular">
      Calcular Orçamento
    </button>

    <div id="resultado"></div>

  </div>

  <script>
    const botao = document.getElementById("calcular");

    botao.addEventListener("click", calcularOrcamento);

    function calcularOrcamento() {

      const pacote = Number(
        document.getElementById("pacote").value
      );

      const pessoas = Number(
        document.getElementById("pessoas").value
      );

      const resultado = document.getElementById("resultado");

      // Valor base
      const valorBase = pacote * pessoas;

      // Taxa de serviço (10%)
      const taxaServico = valorBase * 0.10;

      // Total com taxa
      let total = valorBase + taxaServico;

      // Desconto fidelidade
      let desconto = 0;

      if (pessoas > 100) {
        desconto = total * 0.05;
        total -= desconto;
      }

      resultado.innerHTML = `
        <p><strong>Custo Bruto:</strong> 
        R$ ${valorBase.toFixed(2)}</p>

        <p><strong>Taxa de Serviço (10%):</strong> 
        R$ ${taxaServico.toFixed(2)}</p>

        <p><strong>Desconto Aplicado:</strong> 
        R$ ${desconto.toFixed(2)}</p>

        <p class="total">
          Total Final: R$ ${total.toFixed(2)}
        </p>
      `;
    }
  </script>

</body>
</html>
