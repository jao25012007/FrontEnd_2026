<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Validador de CPF</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #2a5298;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2a5298;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1e3c72;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .valido {
      color: green;
    }

    .invalido {
      color: red;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Validador de CPF</h1>

    <input 
      type="text" 
      id="cpf" 
      placeholder="Digite o CPF"
      maxlength="14"
    />

    <button onclick="validarCPF()">
      Validar
    </button>

    <p id="resultado"></p>
  </div>

  <script>
  function validarCPF() {
    const input = document.getElementById("cpf");
    const resultado = document.getElementById("resultado");

    // Remove pontos e traços
    let cpf = input.value.replace(/\D/g, "");

    // Verifica se tem 11 dígitos
    if (cpf.length !== 11) {
      resultado.textContent = "CPF inválido!";
      resultado.className = "invalido";
      return;
    }

    // Impede CPFs com todos os números iguais
    if (/^(\d)\1+$/.test(cpf)) {
      resultado.textContent = "CPF inválido!";
      resultado.className = "invalido";
      return;
    }

    // ===== 1º dígito =====
    let soma = 0;

    for (let i = 0; i < 9; i++) {
      soma += parseInt(cpf[i]) * (10 - i);
    }

    let digito1 = (soma * 10) % 11;

    if (digito1 === 10) {
      digito1 = 0;
    }

    // ===== 2º dígito =====
    soma = 0;

    for (let i = 0; i < 10; i++) {
      soma += parseInt(cpf[i]) * (11 - i);
    }

    let digito2 = (soma * 10) % 11;

    if (digito2 === 10) {
      digito2 = 0;
    }

    // Verifica os dígitos
    if (
      digito1 == cpf[9] &&
      digito2 == cpf[10]
    ) {
      resultado.textContent = "CPF válido!";
      resultado.className = "valido";
    } else {
      resultado.textContent = "CPF inválido!";
      resultado.className = "invalido";
    }
  }
</script>

</body>
</html>
