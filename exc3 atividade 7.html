<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média Escolar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .container {
      background: white;
      padding: 35px;
      border-radius: 15px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4facfe;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4facfe;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #2196f3;
    }

    #resultado {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .aprovado {
      color: blue;
    }

    .exame {
      color: green;
    }

    .reprovado {
      color: red;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Média Escolar</h1>

    <input type="text" id="nome" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1">

    <input type="number" id="nota2" placeholder="Nota 2">

    <input type="number" id="nota3" placeholder="Nota 3">

    <button id="calcular">
      Calcular Média
    </button>

    <div id="resultado"></div>
  </div>

  <script>
    const botao = document.getElementById("calcular");

    botao.addEventListener("click", () => {

      const nome = document.getElementById("nome").value;

      const nota1 = Number(document.getElementById("nota1").value);
      const nota2 = Number(document.getElementById("nota2").value);
      const nota3 = Number(document.getElementById("nota3").value);

      const resultado = document.getElementById("resultado");

      const media = (nota1 + nota2 + nota3) / 3;

      if (media >= 7 && media <= 10) {

        resultado.innerHTML = `
          ${nome}, sua média foi ${media.toFixed(2)} <br>
          Situação: APROVADO
        `;

        resultado.className = "aprovado";

      } else if (media >= 4 && media < 7) {

        const falta = (10 - media).toFixed(2);

        resultado.innerHTML = `
          ${nome}, sua média foi ${media.toFixed(2)} <br>
          Situação: EXAME <br>
          Faltam ${falta} pontos para chegar em 10.
        `;

        resultado.className = "exame";

      } else {

        resultado.innerHTML = `
          ${nome}, sua média foi ${media.toFixed(2)} <br>
          Situação: REPROVADO
        `;

        resultado.className = "reprovado";
      }

    });
  </script>

</body>
</html>
